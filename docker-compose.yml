services:
  filmizlashbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: filmizlashbot
    restart: unless-stopped
    ports:
      - "8080:8080"
    # .env faylini xavfsiz uzatish usuli:
    # Faqat nomlarni yozasiz — qiymatlar .env faylidan o'qiladi
    # .env fayli hech qachon image ichiga kirmaydi
    env_file:
      - .env
    # Ixtiyoriy: loglarni cheklash (disk to'lib qolmasligi uchun)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Health check — konteyner to'g'ri ishlayotganini tekshirish
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
